name: Compilar APK Android (Flet)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Generar APK de Mis Finanzas
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Clonar Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Instalar Dependencias y CLI Coincidentes
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[all]==0.25.0" "flet-cli==0.25.0" --upgrade
          python -m pip install -r requirements.txt

      - name: 4. Compilar APK Oficial con Flet CLI
        run: |
          flet build apk --verbose

      - name: 5. Publicar APK para Descarga
        uses: actions/upload-artifact@v4
        with:
          name: Mis-Finanzas-APK
          path: build/apk/app-release.apk
          if-no-files-found: error