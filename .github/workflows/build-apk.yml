name: Compilar APK Android Nativo (Flutter)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Generar APK Nativo de Mis Finanzas
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Clonar Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 3. Configurar Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
          cache: true

      - name: 4. Inicializar Plataforma Android y Deep Link OAuth
        run: |
          flutter create . --project-name mis_finanzas --org com.josue.misfinanzas --platforms android
          python3 scripts/configure_android.py
          flutter pub get
          dart run flutter_launcher_icons

      - name: 5. Analizar Código Dart y Ejecutar Tests
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: 6. Compilar APK Release Nativo
        run: |
          flutter build apk --release

      - name: 7. Publicar APK para Descarga
        uses: actions/upload-artifact@v4
        with:
          name: Mis-Finanzas-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error